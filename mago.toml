extends = "vendor/webware/webware-tools/mago.toml"
php-version = "8.4.1"

[linter]
baseline = "lint-baseline.toml"

[linter.rules]
# The eight promoted parameters are the required top-level keys of site-config.schema.json, listed in
# data-model.md. The finding cannot be fixed without inventing nesting the schema does not have, so the
# rule's advice cannot be taken for this file. Excluded here rather than baselined, so every other file
# still carries the rule at the preset threshold.
excessive-parameter-list = { exclude = ["src/Config/SiteConfig.php"] }

[analyzer]
baseline = "analysis-baseline.toml"

[source]
paths = ["src", "test"]
includes = ["vendor"]

# Additive boundary rule for the namespace split. `CommonDoc\Render\` belongs to
# common-doc/commondoc, which provides the document rendering seam this package consumes. A symbol
# declared under that namespace here would be a second, competing copy of a shared surface, so the
# guard gate rejects it rather than leaving the split to review.
#
# `must-be = []` bans every symbol kind. `**` matches zero or more segments, so the rule holds a
# direct child (`CommonDoc\Render\Page`) and any descendant alike.
[[guard.structural.rules]]
on = "CommonDoc\\Render\\**\\*"
must-be = []
reason = "CommonDoc\\Render is owned by common-doc/commondoc and is never declared in this package."
